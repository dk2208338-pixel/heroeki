<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Routines</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routines">
<meta name="theme-color" content="#0F1113">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: one-screen app; header + week strip fixed at top, habit table scrolls, nav fixed at bottom. */
:root{
  --bg:#0F1113; --panel:#171A1E; --card:#1C2024; --card-2:#23282D; --line:#2B3137; --line-2:#363D44;
  --fg:#E9ECEF; --muted:#8E969E; --dim:#5F676F;
  --sage:#8FB8A0; --accent:#6FBF8E; --accent-ink:#0C2416; --accent-dim:rgba(111,191,142,.18);
  --red:#E0655A; --yellow:#E3B23C; --green:#5DBE7F; --neutral:#2E343A;
  --streak:#F0A04B; --streak-bg:#2A2016;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans KR",sans-serif;
  --radius:14px; --nav-h:60px; --nav-pad:0px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--card-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
input::placeholder,textarea::placeholder{color:var(--dim)}
input[type=number]{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.hidden{display:none!important}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:12px}
.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* App frame */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
html{overflow:hidden;position:fixed;inset:0;width:100%}
.screen{flex:1;min-height:0;display:none;flex-direction:column}
.screen.active{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 90px + var(--nav-pad))}
.scroll.tight{padding-bottom:calc(var(--nav-h) + 8px);overscroll-behavior:contain}
.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
nav.tabbar{position:fixed;left:0;right:0;bottom:-18px;z-index:20;background:rgba(15,17,19,.92);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:3px max(24px,env(safe-area-inset-left,0px)) 0 max(24px,env(safe-area-inset-right,0px));height:var(--nav-h);align-items:flex-start}
nav.tabbar button{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:84px;padding:2px 0;color:var(--muted);font-size:10px;font-weight:500;border-radius:10px}
nav.tabbar button.active{color:var(--accent);font-weight:600}
nav.tabbar svg{width:22px;height:22px}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.month-btn{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:700;letter-spacing:-.2px;min-height:44px;padding:0;border-radius:10px;line-height:1.2}
.hdr h1{font-size:22px;font-weight:700;letter-spacing:-.2px;min-height:44px;display:flex;align-items:center;line-height:1.2}
.month-btn svg{width:18px;height:18px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);background:var(--card)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.ghost{background:none;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:15px;background:var(--card);color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.chip.streak{background:var(--streak-bg);color:var(--streak);font-weight:700}
.chip.on{background:var(--fg);color:var(--bg)}
.chip.tag.on{background:var(--accent-dim);color:var(--accent)}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:6px 0 2px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 6px;border-radius:16px;min-height:44px}
.day .dn{font-size:12px;color:var(--muted);font-weight:500}
.day.sel{background:var(--card-2)}
.day.sel .dn{color:var(--fg);font-weight:700}
.day .ring{position:relative;width:40px;height:40px}
.day .ring svg{position:absolute;inset:0;width:40px;height:40px;transform:rotate(-90deg)}
.day .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.day.today .ring .num{color:var(--fg)}
.day .ring.full .num{color:var(--accent-ink);font-weight:700}
.day.future .ring .num{color:var(--dim)}

/* Filters */
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none;-ms-overflow-style:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:0 0 auto;min-height:32px}
.select-wrap{position:relative;flex:0 0 auto}
.select-wrap select{appearance:none;-webkit-appearance:none;height:32px;min-height:32px;padding:0 26px 0 12px;border-radius:16px;background:var(--fg);color:var(--bg);border:0;font-size:13px;font-weight:600;width:auto}
.select-wrap svg{position:absolute;right:9px;top:9px;width:14px;height:14px;color:var(--bg);pointer-events:none}

/* Habit table */
.table{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.hrow{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:30px 84px minmax(0,1fr) 62px;align-items:stretch;border-top:1px solid var(--line);min-height:58px;position:relative;background:var(--panel);transition:background .15s}
.hrow:first-child{border-top:0}
.hrow.dragging{opacity:.5;background:var(--card-2);box-shadow:0 0 0 1.5px var(--accent) inset}
.hrow.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.hrow.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.hrow.done{background:var(--panel)}
.hrow.done .nm{color:var(--muted)}
.hrow.flex-skip .nm{color:var(--fg)}
.c-num{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;border-right:1px solid var(--line);cursor:grab}
.c-note{display:flex;align-items:center;padding:8px 8px;font-size:13px;color:var(--muted);border-right:1px solid var(--line);line-height:1.25;overflow-wrap:anywhere}
.c-name{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;min-width:0;text-align:left;border-right:1px solid var(--line)}
.c-name .em{font-size:19px;line-height:1;flex:0 0 auto}
.c-name .nm{flex:1;min-width:0;font-size:15px;font-weight:500;overflow-wrap:anywhere}
.c-name .sub{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 7px;border-radius:11px;font-size:12px;font-weight:700;flex:0 0 auto;font-variant-numeric:tabular-nums}
.badge.streak{background:var(--streak-bg);color:var(--streak)}
.badge.goal{background:var(--card-2);color:var(--muted);font-weight:600}
.badge.goal.met{background:var(--accent-dim);color:var(--accent)}
.c-log{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;min-height:58px;position:relative}
.c-log .em{font-size:22px;line-height:1;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.c-log .em.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
.c-log .val{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.1;text-align:center}
.c-log .val.met{color:var(--accent);font-weight:700}
.c-log .circle{width:30px;height:30px;border-radius:15px;border:2px solid var(--line-2)}
.c-log .circle.part{border-color:var(--yellow)}
.c-log:disabled{opacity:.4;cursor:default}
.c-log .cnt-ring{position:absolute;inset:6px 10px;border-radius:12px;pointer-events:none}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty strong{color:var(--fg)}
.progress-line{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px;font-size:13px;color:var(--muted)}
.progress-line b{color:var(--fg);font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--neutral);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .3s}

/* FAB */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 16px + var(--nav-pad));width:58px;height:58px;border-radius:29px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:15}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.94)}

/* Sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-radius:18px 18px 0 0;max-height:92%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:translateY(0)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:17px;font-weight:700}
.sheet-h .tb{min-height:40px;padding:0 8px;font-size:16px;color:var(--muted);border-radius:8px}
.sheet-h .tb.primary{color:var(--accent);font-weight:700}
.sheet-b{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.2px;text-transform:uppercase}
.field .help{font-size:12px;color:var(--dim)}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);padding:0 6px}
.seg button.on{background:var(--card-2);color:var(--fg);font-weight:600}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 30%}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.days7 button{height:40px;border-radius:10px;background:var(--card);color:var(--muted);font-size:14px;font-weight:500}
.days7 button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills .chip{min-height:34px}
.chip.add{border:1px dashed var(--line-2);background:none}
.emoji-big{width:84px;height:84px;border-radius:24px;background:var(--card);font-size:44px;display:flex;align-items:center;justify-content:center;align-self:center;position:relative}
.emoji-big input{position:absolute;inset:0;opacity:0;font-size:40px;text-align:center;background:none;border:0}
.emoji-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.emoji-grid button{height:40px;border-radius:10px;background:var(--card);font-size:22px}
.emoji-grid button.on{background:var(--accent-dim);box-shadow:inset 0 0 0 2px var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch{width:50px;height:30px;border-radius:15px;background:var(--line-2);position:relative;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}
.btn{min-height:46px;border-radius:12px;padding:0 16px;font-weight:600;background:var(--card-2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:rgba(224,101,90,.15);color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{min-height:50px;border-radius:12px;background:var(--card);display:flex;align-items:center;gap:12px;padding:0 14px;font-size:16px;text-align:left}
.menu button svg{width:20px;height:20px;color:var(--muted);flex:0 0 auto}
.menu button.danger{color:var(--red)}
.menu button.danger svg{color:var(--red)}
.numpad{display:flex;flex-direction:column;gap:10px}
.numpad .big{font-size:28px;font-weight:700;text-align:center;min-height:56px;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px}
.stepper button{width:56px;height:56px;border-radius:28px;background:var(--card-2);font-size:28px;font-weight:500}
.stepper .total{font-size:34px;font-weight:700;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}

/* Calendar (month) */
.cal{display:flex;flex-direction:column;gap:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h .ttl{font-size:17px;font-weight:700}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-grid button{height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--fg);position:relative}
.cal-grid button.other{color:var(--dim)}
.cal-grid button.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-grid button.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal-grid button .dot{width:5px;height:5px;border-radius:3px;background:var(--neutral)}
.cal-grid button .dot.r{background:var(--red)}.cal-grid button .dot.y{background:var(--yellow)}.cal-grid button .dot.g{background:var(--green)}
.cal-grid button.sel .dot{background:var(--accent-ink)}
.cal-grid button.future{color:var(--dim)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#2A3036;color:var(--fg);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:50;opacity:0;transition:all .2s;pointer-events:none;max-width:calc(100% - 32px);font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:700;min-height:36px;padding:0 10px;border-radius:8px;background:rgba(111,191,142,.12)}

/* Stats */
.tabs{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:2px;margin:8px 0 4px}
.tabs button{flex:1;min-height:38px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--card-2);color:var(--fg);font-weight:700}
.pnav{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.pnav .ttl{font-size:17px;font-weight:700}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scard{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.scard .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;min-width:0}
.scard .t .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mini span{aspect-ratio:1;border-radius:4px;background:var(--neutral);display:flex;align-items:center;justify-content:center;font-size:10px;max-width:100%}
.mini span.ok{background:var(--green);color:#0b2416;font-weight:700}
.mini span.na{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.mini span.blank{background:transparent}
.scard .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scard .meta b{color:var(--fg)}
.sumline{background:var(--card);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sumline b{font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:11px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--dim)}
.wk-bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:120px;background:var(--card);border-radius:12px;padding:12px 12px 6px}
.wk-bars .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.wk-bars .col .b{width:100%;border-radius:5px 5px 2px 2px;background:var(--neutral);min-height:3px}
.wk-bars .col .p{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-bars .col .d{font-size:11px;color:var(--muted)}
.wk-bars .col.today .d{color:var(--fg);font-weight:700}
.list{display:flex;flex-direction:column;background:var(--card);border-radius:12px;overflow:hidden}
.list .li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);min-height:48px;font-size:14px}
.list .li:first-child{border-top:0}
.list .li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .li .v{font-variant-numeric:tabular-nums;color:var(--muted)}
.list .li.btn-row{cursor:pointer}
.gl-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.gl-grid span{aspect-ratio:1;border-radius:8px;background:var(--neutral);display:flex;align-items:center;justify-content:center;font-size:15px;position:relative}
.gl-grid span.ok{background:var(--green)}
.gl-grid span.na{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.gl-grid span.blank{background:transparent}
.gl-grid span i{position:absolute;top:3px;left:5px;font-size:9px;font-style:normal;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
.gl-grid span.ok i{color:rgba(0,0,0,.55)}
.mcard{background:var(--card);border-radius:16px;padding:12px 10px 10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mcard .t{display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:14px;min-width:0}
.mcard .t .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
'use strict';
/* ========== Utilities ========== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYS_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MONTHS_S = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function todayStr() { return fmtDate(new Date()); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); }
function dow(s) { return parseDate(s).getDay(); }
function weekStart(s) { return addDays(s, -dow(s)); }
function monthStart(s) { return s.slice(0, 7) + '-01'; }
function monthKey(s) { return s.slice(0, 7); }
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function addMonths(ym, n) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }

function weekDays(start) { const out = []; for (let i = 0; i < 7; i++) out.push(addDays(start, i)); return out; }
function cmpDate(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
function fmtTime(iso) { const d = new Date(iso); let h = d.getHours(); const m = d.getMinutes(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12; if (h === 0) h = 12; return h + ':' + pad(m) + ' ' + ap; }
function fmtMinutes(min) { min = Math.round(min); let h = Math.floor(min / 60) % 24; const m = min % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12; if (h === 0) h = 12; return h + ':' + pad(m) + ' ' + ap; }
function fmtDuration(min) { min = Math.round(min); const h = Math.floor(min / 60), m = min % 60; return h + 'h ' + (m ? pad(m) + 'm' : '').trim(); }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 10); } catch (e) {} }

/* ========== Persistence (IndexedDB, localStorage fallback) ========== */
const DB_NAME = 'routines-db', STORE = 'kv';
const Store = {
  db: null, memo: {},
  open() {
    return new Promise(res => {
      if (!window.indexedDB) return res(null);
      let req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { return res(null); }

      req.onblocked = () => res(null);

  async get(key) {

      try {
        return await new Promise((res, rej) => { const tx = this.db.transaction(STORE, 'readonly'); const r = tx.objectStore(STORE).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

  async set(key, val) {
    let ok = false;

      try {

      } catch (e) {}

    try { localStorage.setItem('routines:' + key, JSON.stringify(val)); ok = true; } catch (e) {}
    return ok;
  }

/* ========== State ========== */
const S = {
  habits: [], tags: [], logs: {}, // logs[habitId][date] = entry
  settings: { threshold: 80, completedBehavior: 'bottom', lastBackup: null },
  ui: { screen: 'home', date: todayStr(), weekStart: weekStart(todayStr()), timeFilter: 'all', tagFilter: null, statTab: 'monthly', statMonth: monthKey(todayStr()), statWeek: weekStart(todayStr()), statTag: null, detailHabit: null, detailRange: 'month' }

const saveTimers = {};

}
function persistAll() { ['habits', 'tags', 'logs', 'settings'].forEach(persist); }

const DEFAULT_HABIT = () => ({
  id: uid(), name: '', emoji: '✅', note: '', timeOfDay: 'any', tags: [], mode: 'check',
  schedule: { type: 'daily', days: [1, 2, 3, 4, 5], target: 3 },
  value: { unit: '', format: 'number', target: null, cmp: '<=', success: 'record' },
  count: { target: 8, unit: 'glasses', step: 1, allowOver: true, completeOn: 'target' },
  streak: false, order: 0, createdAt: todayStr(), deletedAt: null
});

/* ========== Log helpers ========== */
function getLog(hid, date) { return (S.logs[hid] || {})[date] || null; }
function setLog(hid, date, entry) {
  if (!S.logs[hid]) S.logs[hid] = {};
  if (entry == null || (entry.done === false && entry.value == null && !(entry.total > 0) && !(entry.events && entry.events.length))) delete S.logs[hid][date];
  else S.logs[hid][date] = entry;
  if (S.logs[hid] && !Object.keys(S.logs[hid]).length) delete S.logs[hid];
  persist('logs');
}
function habitById(id) { return S.habits.find(h => h.id === id); }
function activeHabits() { return S.habits.filter(h => !h.deletedAt).sort((a, b) => a.order - b.order); }

/* ========== Scheduling ========== */
function isFlex(h) { return h.schedule.type === 'weekly' || h.schedule.type === 'monthly'; }
function existsOn(h, date) { return date >= h.createdAt && (!h.deletedAt || date < h.deletedAt); }
function isScheduled(h, date) {
  if (!existsOn(h, date)) return false;
  const t = h.schedule.type;
  if (t === 'daily') return true;
  if (t === 'weekdays') return h.schedule.days.includes(dow(date));
  return true; // weekly / monthly goals appear every day
}
function periodKey(h, date) { return h.schedule.type === 'weekly' ? weekStart(date) : h.schedule.type === 'monthly' ? monthKey(date) : date; }
function periodDays(h, key) { return h.schedule.type === 'weekly' ? weekDays(key) : h.schedule.type === 'monthly' ? monthDays(key) : [key]; }

/* ========== Completion ========== */
function isDone(h, date) {
  const l = getLog(h.id, date); if (!l) return false;
  if (h.mode === 'check' || h.mode === 'time') return !!l.done;
  if (h.mode === 'value') { if (l.value == null) return false; if (h.value.success === 'target' && h.value.target != null) return meetsTarget(h, l.value); return true; }
  if (h.mode === 'count') { const t = l.total || 0; return h.count.completeOn === 'any' ? t > 0 : t >= h.count.target; }
  return false;
}
function meetsTarget(h, v) { const t = h.value.target; if (t == null || v == null) return false; return h.value.cmp === '>=' ? v >= t : v <= t; }
function periodProgress(h, date) {
  const key = periodKey(h, date); const days = periodDays(h, key);
  let n = 0; days.forEach(d => { if (existsOn(h, d) && isDone(h, d)) n++; });
  return { n, target: h.schedule.target, key, days };
}
/* Day score: fixed-schedule habits always count; weekly/monthly goals count only when completed that day. */
function dayScore(date, habits) {
  habits = habits || activeHabitsOn(date);
  let due = 0, done = 0, fixed = 0;
  habits.forEach(h => {
    if (!isScheduled(h, date)) return;
    const d = isDone(h, date);
    if (isFlex(h)) { if (d) { due++; done++; } } else { fixed++; due++; if (d) done++; }
  });
  const pct = due ? Math.round(done / due * 100) : null;
  return { due, done, pct, fixed };
}
function activeHabitsOn(date) { return S.habits.filter(h => existsOn(h, date)).sort((a, b) => a.order - b.order); }
function scoreColor(pct) { if (pct == null) return null; if (pct >= S.settings.threshold) return 'g'; if (pct >= 50) return 'y'; return 'r'; }
function colorVar(c) { return c === 'g' ? 'var(--green)' : c === 'y' ? 'var(--yellow)' : c === 'r' ? 'var(--red)' : 'var(--neutral)'; }
function isGreenDay(date) { const s = dayScore(date); return s.pct != null && s.pct >= S.settings.threshold; }

/* ========== Streaks ========== */
function periodMet(h, key) {
  if (isFlex(h)) { const days = periodDays(h, key); let n = 0; days.forEach(d => { if (existsOn(h, d) && isDone(h, d)) n++; }); return n >= h.schedule.target; }
  return isDone(h, key);
}
function prevPeriod(h, key) { if (h.schedule.type === 'weekly') return addDays(key, -7); if (h.schedule.type === 'monthly') return addMonths(key, -1); let d = addDays(key, -1); if (h.schedule.type === 'weekdays') { let guard = 0; while (!h.schedule.days.includes(dow(d)) && guard++ < 8) d = addDays(d, -1); } return d; }
function nextPeriod(h, key) { if (h.schedule.type === 'weekly') return addDays(key, 7); if (h.schedule.type === 'monthly') return addMonths(key, 1); let d = addDays(key, 1); if (h.schedule.type === 'weekdays') { let guard = 0; while (!h.schedule.days.includes(dow(d)) && guard++ < 8) d = addDays(d, 1); } return d; }
function periodStartDate(h, key) { return h.schedule.type === 'monthly' ? key + '-01' : key; }
function currentStreak(h, asOf) {
  asOf = asOf || todayStr();
  if (h.schedule.type === 'weekdays' && !h.schedule.days.length) return 0;
  let key = periodKey(h, asOf);
  let n = 0;
  // current period: counts if met, otherwise skipped (not broken)
  if (periodMet(h, key)) n++;
  key = prevPeriod(h, key);
  let guard = 0;
  while (guard++ < 2000) {

/* ========== Sheet & toast ========== */
const Sheet = {
  open(title, bodyEl, opts = {}) {
    const h = $('#sheetH'), b = $('#sheetB');
    h.innerHTML = '';
    const left = el(`<button class="tb" id="sheetCancel">${esc(opts.cancelLabel || 'Close')}</button>`);
    const ttl = el(`<h2>${esc(title)}</h2>`);
    h.append(left, ttl);
    if (opts.primary) { const p = el(`<button class="tb primary">${esc(opts.primary)}</button>`); p.addEventListener('click', opts.onPrimary); h.append(p); } else h.append(el('<span style="width:60px"></span>'));
    b.innerHTML = ''; b.append(bodyEl);
    left.addEventListener('click', () => { if (opts.onCancel) opts.onCancel(); Sheet.close(); });
    $('#backdrop').classList.add('show'); $('#sheet').classList.add('show');
    this.onClose = opts.onClose || null;
  },
  close() { $('#backdrop').classList.remove('show'); $('#sheet').classList.remove('show'); if (this.onClose) { const f = this.onClose; this.onClose = null; f(); } }
};
$('#backdrop').addEventListener('click', () => Sheet.close());

let toastTimer = null, undoAction = null;
function toast(msg, undo) {
  const t = $('#toast'); $('#toastMsg').textContent = msg;
  const u = $('#toastUndo'); undoAction = undo || null; u.classList.toggle('hidden', !undo);
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), undo ? 4500 : 2200);
}
$('#toastUndo').addEventListener('click', () => { if (undoAction) { undoAction(); undoAction = null; } $('#toast').classList.remove('show'); });

/* ========== Navigation ========== */
function showScreen(name) {
  S.ui.screen = name;
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === 'scr-' + name));
  $$('nav.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.s === name));
  $('#fab').classList.toggle('hidden', name !== 'home');
  if (name === 'home') renderHome(); if (name === 'stats') renderStats();
}
$$('nav.tabbar button').forEach(b => b.addEventListener('click', () => showScreen(b.dataset.s)));

/* ========== Home ========== */
function renderHome() { renderHeader(); renderWeek(); renderFilters(); renderTable(); }
function renderHeader() {
  const d = parseDate(S.ui.date);
  $('#monthLbl').textContent = MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function ringSVG(date, size) {
  const habits = activeHabitsOn(date).filter(h => isScheduled(h, date));
  const fixed = habits.filter(h => !isFlex(h));
  const flexDone = habits.filter(h => isFlex(h) && isDone(h, date));
  const segs = fixed.map(h => isDone(h, date)).concat(flexDone.map(() => true));
  const score = dayScore(date, habits);
  const c = scoreColor(score.pct);
  const r = 17, cx = 20, cy = 20, circ = 2 * Math.PI * r;
  let out = `<svg viewBox="0 0 40 40" aria-hidden="true">`;
  if (!segs.length) { out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--neutral)" stroke-width="4"/>`; }
  else {
    const n = segs.length, gap = n > 1 ? Math.min(3, circ / n * 0.18) : 0, len = circ / n - gap;
    segs.forEach((on, i) => {
      out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${on ? colorVar(c) : 'var(--neutral)'}" stroke-width="4" stroke-dasharray="${len} ${circ - len}" stroke-dashoffset="${-(i * (len + gap))}" stroke-linecap="${n > 1 ? 'butt' : 'round'}"/>`;
    });
  }
  out += '</svg>';
  return { svg: out, score, c, full: score.pct != null && score.pct >= 100 && score.due > 0 && c === 'g' };
}
function renderWeek() {
  const w = $('#week'); w.innerHTML = '';
  const t = todayStr();
  weekDays(S.ui.weekStart).forEach(date => {
    const { svg, full, c } = ringSVG(date);
    const b = el(`<button class="day ${date === S.ui.date ? 'sel' : ''} ${date === t ? 'today' : ''} ${date > t ? 'future' : ''}" aria-label="${DAYS_FULL[dow(date)]} ${date}"><span class="dn">${DAYS[dow(date)]}</span><span class="ring ${full ? 'full' : ''}">${svg}<span class="num">${Number(date.slice(8))}</span></span></button>`);
    if (full) b.querySelector('.ring').style.background = 'var(--green)';
    if (full) b.querySelector('.ring').style.borderRadius = '20px';
    b.addEventListener('click', () => { S.ui.date = date; renderHome(); });
    w.append(b);
  });
}
let touchX = null;
$('#week').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
$('#week').addEventListener('touchend', e => { if (touchX == null) return; const dx = e.changedTouches[0].clientX - touchX; touchX = null; if (Math.abs(dx) > 50) { S.ui.weekStart = addDays(S.ui.weekStart, dx < 0 ? 7 : -7); S.ui.date = S.ui.weekStart === weekStart(todayStr()) ? todayStr() : S.ui.weekStart; renderHome(); } }, { passive: true });

function renderFilters() {
  const f = $('#filters'); f.innerHTML = '';
  const sel = el(`<div class="select-wrap"><select id="timeSel" aria-label="Time of day filter"><option value="all">All Times</option><option value="morning">Morning</option><option value="afternoon">Afternoon</option><option value="evening">Evening/Night</option></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>`);
  sel.querySelector('select').value = S.ui.timeFilter;
  sel.querySelector('select').addEventListener('change', e => { S.ui.timeFilter = e.target.value; renderTable(); });
  f.append(sel);
  const all = el(`<button class="chip tag ${S.ui.tagFilter == null ? 'on' : ''}">All</button>`);
  all.addEventListener('click', () => { S.ui.tagFilter = null; renderFilters(); renderTable(); });
  f.append(all);
  S.tags.forEach(t => {
    const b = el(`<button class="chip tag ${S.ui.tagFilter === t.id ? 'on' : ''}">${esc(t.emoji ? t.emoji + ' ' : '')}${esc(t.name)}</button>`);
    b.addEventListener('click', () => { S.ui.tagFilter = S.ui.tagFilter === t.id ? null : t.id; renderFilters(); renderTable(); });
    f.append(b);
  });
}
function visibleHabits(date) {
  return activeHabits().filter(h => existsOn(h, date) && isScheduled(h, date))
    .filter(h => S.ui.timeFilter === 'all' || h.timeOfDay === S.ui.timeFilter || h.timeOfDay === 'any')
    .filter(h => S.ui.tagFilter == null || h.tags.includes(S.ui.tagFilter));
}
function logCell(h, date) {
  const l = getLog(h.id, date); const done = isDone(h, date);
  if (h.mode === 'check') return done ? `<span class="em">${esc(h.emoji)}</span>` : `<span class="circle"></span>`;
  if (h.mode === 'time') return done ? `<span class="em">${esc(h.emoji)}</span><span class="val">${l && l.at ? fmtTime(l.at) : ''}</span>` : `<span class="circle"></span>`;
  if (h.mode === 'value') {
    if (l && l.value != null) { const met = h.value.target != null ? meetsTarget(h, l.value) : null; return `<span class="em">${esc(h.emoji)}</span><span class="val ${met ? 'met' : ''}">${esc(fmtValue(h, l.value))}</span>`; }
    return `<span class="circle"></span>`;
  }
  if (h.mode === 'count') {
    const t = l ? (l.total || 0) : 0; const met = t >= h.count.target;
    return `<span class="em" ${t ? '' : 'style="opacity:.45"'}>${esc(h.emoji)}</span><span class="val ${met ? 'met' : ''}">${fmtNum(t)}/${fmtNum(h.count.target)}</span>`;
  }
  return '';
}
function fmtValue(h, v) {
  if (h.value.format === 'time') return fmtMinutes(v);
  if (h.value.format === 'duration') return fmtDuration(v);
  return fmtNum(v) + (h.value.unit ? ' ' + h.value.unit : '');
}

/* ========== Logging ========== */
function snapshot(h, date) { const l = getLog(h.id, date); return l ? clone(l) : null; }
function restore(h, date, snap) { setLog(h.id, date, snap ? clone(snap) : null); renderHome(); }
function popCell(row) { const em = row && row.querySelector('.c-log .em'); if (em) { em.classList.remove('pop'); void em.offsetWidth; em.classList.add('pop'); } }
function afterLog(h, date, msg, snap) {

  toast(msg, () => restore(h, date, snap));
}
function logAction(h, date, row) {
  const snap = snapshot(h, date);
  if (h.mode === 'check') {
    const l = getLog(h.id, date);
    if (l && l.done) { setLog(h.id, date, Object.assign({}, l, { done: false, at: null })); afterLog(h, date, `${h.name} undone`, snap); }
    else { setLog(h.id, date, { done: true, at: new Date().toISOString() }); afterLog(h, date, `${h.emoji} ${h.name} completed`, snap); }
    return;
  }
  if (h.mode === 'time') {
    const l = getLog(h.id, date);
    if (l && l.done) { setLog(h.id, date, null); afterLog(h, date, `${h.name} cleared`, snap); return; }
    if (date === todayStr()) { setLog(h.id, date, { done: true, at: new Date().toISOString() }); afterLog(h, date, `${h.emoji} ${h.name} at ${fmtTime(new Date().toISOString())}`, snap); }
    else timeSheet(h, date);
    return;
  }
  if (h.mode === 'value') { valueSheet(h, date); return; }
  if (h.mode === 'count') {
    const l = getLog(h.id, date) || { total: 0, events: [] };
    const step = h.count.step || 1;
    if (!h.count.allowOver && (l.total || 0) >= h.count.target) { toast(`${h.name} already at target (${fmtNum(h.count.target)} ${h.count.unit})`); countSheet(h, date); return; }
    const total = Math.round(((l.total || 0) + step) * 1000) / 1000;
    const events = (l.events || []).concat([{ d: step, at: new Date().toISOString() }]);
    setLog(h.id, date, Object.assign({}, l, { total, events, done: total >= h.count.target }));
    const met = total >= h.count.target;
    afterLog(h, date, `${h.emoji} ${h.name} ${fmtNum(total)}/${fmtNum(h.count.target)}${met ? ' · target reached' : ''}`, snap);
    return;
  }
}

/* ========== Drag reorder (long-press anywhere on the row) ========== */
function attachDrag(row, h) {
  let timer = null, dragging = false, startX = 0, startY = 0, pid = null;
  const blockTouch = e => { if (dragging) e.preventDefault(); };
  const onMove = e => {
    if (!dragging) { if (Math.abs(e.clientY - startY) > 10 || Math.abs(e.clientX - startX) > 10) cleanup(); return; }
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const target = under && under.closest('.hrow');
    $$('.hrow').forEach(r => r.classList.remove('drop-before', 'drop-after'));
    if (target && target !== row) { const rect = target.getBoundingClientRect(); target.classList.add(e.clientY < rect.top + rect.height / 2 ? 'drop-before' : 'drop-after'); }
  };
  const onUp = e => {
    if (dragging) {
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const target = under && under.closest('.hrow');
      if (target && target !== row) {
        const rect = target.getBoundingClientRect(); const before = e.clientY < rect.top + rect.height / 2;
        const ids = $$('.hrow').map(r => r.dataset.id).filter(id => id !== h.id);
        const idx = ids.indexOf(target.dataset.id); ids.splice(before ? idx : idx + 1, 0, h.id);
        const vis = new Set(ids); const all = activeHabits();
        const merged = []; let vi = 0;
        all.forEach(x => { if (vis.has(x.id)) { merged.push(habitById(ids[vi++])); } else merged.push(x); });
        merged.forEach((x, i) => { x.order = i; });
        persist('habits'); haptic(10);
      }
      row.dataset.justDragged = '1'; setTimeout(() => { delete row.dataset.justDragged; }, 400);
      renderTable();
    }
    cleanup();
  };
  const cleanup = () => { clearTimeout(timer); dragging = false; row.classList.remove('dragging'); $$('.hrow').forEach(r => r.classList.remove('drop-before', 'drop-after')); window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp); window.removeEventListener('touchmove', blockTouch); };
  row.addEventListener('pointerdown', e => {
    if (e.target.closest('.c-log')) return; // the log button never starts a drag
    startX = e.clientX; startY = e.clientY; pid = e.pointerId;
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp);
    window.addEventListener('touchmove', blockTouch, { passive: false });
    timer = setTimeout(() => { dragging = true; row.classList.add('dragging'); haptic(15); try { row.setPointerCapture(pid); } catch (x) {} }, 350);
  });
  // a tap that ended a drag must not open the menu
  row.addEventListener('click', e => { if (row.dataset.justDragged || dragging) { e.stopPropagation(); e.preventDefault(); } }, true);
}

/* ========== Month calendar sheet ========== */
function monthCalendar(ym, selected, onPick, opts = {}) {
  const wrap = el(`<div class="cal"><div class="cal-h"><button class="icon-btn" id="cPrev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><span class="ttl" id="cTtl"></span><div class="row"><button class="chip" id="cToday">Today</button><button class="icon-btn" id="cNext" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div></div><div class="cal-dow">${DAYS.map(d => `<span>${d}</span>`).join('')}</div><div class="cal-grid" id="cGrid"></div></div>`);
  let cur = ym;
  const draw = () => {
    const [y, m] = cur.split('-').map(Number);
    wrap.querySelector('#cTtl').textContent = MONTHS[m - 1] + ' ' + y;
    const g = wrap.querySelector('#cGrid'); g.innerHTML = '';
    const first = dow(cur + '-01'); const n = daysInMonth(y, m - 1); const t = todayStr();
    const prevN = daysInMonth(y, m - 2);
    for (let i = 0; i < first; i++) { const d = prevN - first + 1 + i; g.append(el(`<button class="other" disabled>${d}</button>`)); }
    for (let d = 1; d <= n; d++) {
      const ds = cur + '-' + pad(d);
      const sc = dayScore(ds); const hasLog = S.habits.some(h => getLog(h.id, ds));
      const c = scoreColor(sc.pct);
      const b = el(`<button class="${ds === t ? 'today' : ''} ${ds === selected ? 'sel' : ''} ${ds > t ? 'future' : ''}">${d}${hasLog ? `<span class="dot ${c || ''}"></span>` : ''}</button>`);
      b.addEventListener('click', () => onPick(ds));
      g.append(b);
    }
  };
  wrap.querySelector('#cPrev').addEventListener('click', () => { cur = addMonths(cur, -1); draw(); });
  wrap.querySelector('#cNext').addEventListener('click', () => { cur = addMonths(cur, 1); draw(); });
  wrap.querySelector('#cToday').addEventListener('click', () => { onPick(todayStr()); });
  draw();
  return wrap;
}

    b.append(pnav(monthTitle(S.ui.statMonth), () => { S.ui.statMonth = addMonths(S.ui.statMonth, -1); renderStats(); }, () => { S.ui.statMonth = addMonths(S.ui.statMonth, 1); renderStats(); }));
    b.append(tagFilterBar(renderStats));
    const days = monthDays(S.ui.statMonth);
    const hs = statHabits().filter(h => days.some(d => existsOn(h, d)));
    if (!hs.length) { b.append(el('<div class="empty"><strong>No habits in this month</strong><span>Logs will appear here once you start.</span></div>')); return; }
    const grid = el('<div class="cards2"></div>'); hs.forEach(h => grid.append(monthBlock(h, S.ui.statMonth))); b.append(grid);
  }
  if (tab === 'weekly') {
    b.append(pnav(weekTitle(S.ui.statWeek), () => { S.ui.statWeek = addDays(S.ui.statWeek, -7); renderStats(); }, () => { S.ui.statWeek = addDays(S.ui.statWeek, 7); renderStats(); }));
    b.append(tagFilterBar(renderStats));
    const days = weekDays(S.ui.statWeek);
    const hs = statHabits().filter(h => days.some(d => existsOn(h, d)));
    if (!hs.length) { b.append(el('<div class="empty"><strong>No habits in this week</strong><span>Logs will appear here once you start.</span></div>')); return; }
    const tbl = el('<div class="wtable"></div>');
    tbl.append(el(`<div class="wrow head"><span></span>${days.map(d => `<span class="${d === t ? 'td' : ''}">${DAYS[dow(d)][0]}</span>`).join('')}</div>`));
    hs.forEach(h => {
      let goal = '';
      if (h.schedule.type === 'weekly') { const p = periodProgress(h, S.ui.statWeek); goal = `<span class="badge goal ${p.n >= p.target ? 'met' : ''}" style="height:18px;font-size:10px;padding:0 5px">${p.n}/${p.target}</span>`; }
      const cells = days.map(d => { const st = habitDayStatus(h, d); if (st === 'na' || st === 'future') return '<span class="c na">–</span>'; return `<span class="c ${st === 'ok' ? 'ok' : ''}" title="${d}"></span>`; }).join('');
      tbl.append(el(`<div class="wrow"><div class="nm"><span class="em">${esc(h.emoji)}</span><span class="tx">${esc(h.name)}</span>${goal}</div>${cells}</div>`));
    });
    b.append(tbl);
  }
  if (tab === 'green') {
    b.append(pnav(monthTitle(S.ui.statMonth), () => { S.ui.statMonth = addMonths(S.ui.statMonth, -1); renderStats(); }, () => { S.ui.statMonth = addMonths(S.ui.statMonth, 1); renderStats(); }));
    const days = monthDays(S.ui.statMonth);
    const [yy, mm] = S.ui.statMonth.split('-').map(Number);
    const first = dow(days[0]); let green = 0, elig = 0;
    const prevN = daysInMonth(yy, mm - 2);
    let cells = '';
    for (let i = 0; i < first; i++) cells += `<span class="pm">${prevN - first + 1 + i}</span>`;
    days.forEach(d => {
      const s = d > t ? null : dayScore(d);
      let cls = d > t ? 'fut' : 'none';
      if (s && s.pct != null) { elig++; const c = scoreColor(s.pct); cls = c; if (c === 'g') green++; }
      cells += `<span class="${cls}" title="${d}${s && s.pct != null ? ' · ' + s.pct + '%' : ''}">${Number(d.slice(8))}</span>`;
    });
    const pct = elig ? Math.round(green / elig * 100) : 0;
    b.append(el(`<div class="gl-hero"><div class="k">🟢</div><div class="v">${green}<small>days</small></div></div>`));
    b.append(el(`<div class="gl-head"><span>This Month in Lights</span><span class="muted">${monthTitle(S.ui.statMonth)}</span></div>`));
    b.append(el(`<div class="cal-dow">${DAYS.map(d => `<span>${d}</span>`).join('')}</div>`));
    b.append(el(`<div class="gl-circles">${cells}</div>`));
    b.append(el(`<div class="gl-pct"><div class="k">% Green Light <span class="muted">${elig ? pct + '%' : ''}</span></div><div class="track"><i style="width:${pct}%"></i><b style="left:20%"></b><b style="left:40%"></b><b style="left:60%"></b><b style="left:80%"></b></div><div class="ticks"><span style="left:20%">20</span><span style="left:40%">40</span><span style="left:60%">60</span><span style="left:80%">80</span></div></div>`));
  }
}
/* ========== Boot ========== */
async function boot() {
  await Store.open();
  const [habits, tags, logs, settings] = await Promise.all([Store.get('habits'), Store.get('tags'), Store.get('logs'), Store.get('settings')]);
  if (Array.isArray(habits)) S.habits = habits; if (Array.isArray(tags)) S.tags = tags; if (logs && typeof logs === 'object') S.logs = logs; if (settings) S.settings = Object.assign(S.settings, settings);
  // migrate / defaults
  S.habits.forEach((h, i) => { const d = DEFAULT_HABIT(); h.value = Object.assign(d.value, h.value || {}); h.count = Object.assign(d.count, h.count || {}); h.schedule = Object.assign(d.schedule, h.schedule || {}); if (h.order == null) h.order = i; if (!h.tags) h.tags = []; if (!h.timeOfDay) h.timeOfDay = 'any'; if (h.streak == null) h.streak = false; });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  renderHome();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { const t = todayStr(); if (S.ui.date !== t && S.ui.screen === 'home' && S.ui._lastToday !== t) { S.ui.date = t; S.ui.weekStart = weekStart(t); renderHome(); } S.ui._lastToday = t; } });
  S.ui._lastToday = todayStr();
}
boot();

window.__app = { S, DEFAULT_HABIT, Sheet };

</script>
